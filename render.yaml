services:
  - type: web
    name: luminari-web
    runtime: static
    branch: main
    buildCommand: npm run build
    staticPublishPath: ./public

  - type: web
    name: luminari-api
    runtime: node
    region: oregon
    plan: starter
    branch: main
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: luminari-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: luminari-cache
          property: connectionString

  - type: worker
    name: luminari-worker
    runtime: node
    region: oregon
    plan: starter
    branch: main
    buildCommand: npm install
    startCommand: npm run worker
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: luminari-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: luminari-cache
          property: connectionString

  - type: cron
    name: luminari-nightly-cleanup
    runtime: node
    region: oregon
    plan: starter
    branch: main
    schedule: "0 3 * * *"
    buildCommand: npm install
    startCommand: npm run cleanup
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: luminari-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: luminari-cache
          property: connectionString

  - type: keyvalue
    name: luminari-cache
    region: oregon
    plan: starter
    ipAllowList: []

databases:
  - name: luminari-db
    region: oregon
    plan: basic-256mb
