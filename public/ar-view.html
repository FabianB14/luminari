<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Luminara AR View</title>
  <style>
    :root{color-scheme:dark;font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;--ink:#fff8ff;--muted:#c8c1df;--line:rgba(192,157,255,.28);--panel:rgba(18,15,48,.62);--cyan:#51f6ff;--violet:#9b6cff;--pink:#ff74d4;--gold:#fff0a6;--green:#74f7aa}*{box-sizing:border-box}html,body{margin:0;min-height:100%;overflow:hidden}body{color:var(--ink);background:#070b1c}button{font:inherit;min-height:42px;border:1px solid var(--line);border-radius:999px;padding:0 14px;color:var(--ink);background:linear-gradient(180deg,rgba(126,92,205,.72),rgba(28,24,75,.82));box-shadow:0 0 24px rgba(81,246,255,.14);cursor:pointer}button:disabled{opacity:.48}.camera{position:fixed;inset:0;width:100%;height:100%;object-fit:cover;background:radial-gradient(ellipse at 50% 70%,rgba(81,246,255,.18),transparent 34%),#080c22}.veil{position:fixed;inset:0;background:linear-gradient(180deg,rgba(6,8,28,.5),rgba(6,8,28,.05) 36%,rgba(6,8,28,.72));pointer-events:none}.grid{position:fixed;inset:0;background:linear-gradient(rgba(81,246,255,.08) 1px,transparent 1px),linear-gradient(90deg,rgba(81,246,255,.07) 1px,transparent 1px);background-size:44px 44px;mix-blend-mode:screen;pointer-events:none}.top{position:fixed;left:12px;right:12px;top:calc(12px + env(safe-area-inset-top));z-index:4;display:grid;gap:10px}.brand{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:11px 13px;border:1px solid var(--line);border-radius:18px;background:rgba(7,8,28,.62);backdrop-filter:blur(16px)}.brand small{display:block;color:var(--muted);font-weight:800;letter-spacing:.18em;text-transform:uppercase}.brand strong{font-family:Georgia,"Times New Roman",serif;font-size:1.55rem;font-weight:500;letter-spacing:.08em}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.stat{padding:10px;border:1px solid var(--line);border-radius:14px;background:rgba(14,12,42,.68);backdrop-filter:blur(14px)}.label{display:block;color:var(--muted);font-size:.7rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase}.stat strong{display:block;margin-top:3px}.world{position:fixed;inset:120px 0 116px;z-index:2;pointer-events:none}.marker{position:absolute;left:var(--x);top:var(--y);transform:translate(-50%,-50%);display:grid;justify-items:center;gap:7px;filter:drop-shadow(0 0 20px var(--color));pointer-events:auto}.orb{width:30px;height:30px;border-radius:50%;background:radial-gradient(circle at 38% 30%,#fff 0 12%,var(--color) 28%,rgba(255,255,255,.08) 70%);box-shadow:0 0 0 9px color-mix(in srgb,var(--color),transparent 78%),0 0 28px var(--color)}.plant .orb{width:42px;height:42px;border-radius:42% 58% 48% 52%;background:radial-gradient(circle at 50% 22%,#fff 0 8%,var(--color) 18%,rgba(9,12,39,.95) 72%)}.tag{max-width:170px;padding:8px 10px;border:1px solid color-mix(in srgb,var(--color),white 24%);border-radius:12px;background:rgba(8,8,28,.72);backdrop-filter:blur(14px);text-align:center}.tag strong{display:block;font-size:.86rem}.tag span{display:block;color:var(--muted);font-size:.75rem}.bottom{position:fixed;left:12px;right:12px;bottom:calc(12px + env(safe-area-inset-bottom));z-index:5;display:grid;gap:10px}.dock{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;padding:10px;border:1px solid var(--line);border-radius:18px;background:rgba(7,8,28,.62);backdrop-filter:blur(16px)}.feed{max-height:34vh;overflow:auto;display:grid;gap:8px}.card{padding:12px;border:1px solid var(--line);border-radius:14px;background:rgba(14,12,42,.72);backdrop-filter:blur(14px)}.card-title{display:flex;justify-content:space-between;gap:12px}.card p{margin:7px 0 0;color:var(--muted);line-height:1.35}.pill{display:inline-flex;align-items:center;min-height:24px;padding:0 8px;border:1px solid var(--line);border-radius:999px;color:var(--cyan);font-size:.75rem;font-weight:800}.empty{padding:12px;color:var(--muted);text-align:center}@media(max-width:620px){.stats{grid-template-columns:1fr 1fr 1fr}.brand strong{font-size:1.2rem}.world{inset:142px 0 122px}.tag{max-width:130px}.tag strong{font-size:.76rem}}
  </style>
</head>
<body>
  <video class="camera" id="camera" autoplay playsinline muted></video>
  <div class="veil"></div><div class="grid"></div>
  <section class="top">
    <div class="brand"><div><small>Interverse</small><strong>Luminara View</strong></div><button id="homeButton" type="button">Menu</button></div>
    <div class="stats"><div class="stat"><span class="label">Status</span><strong id="status">Starting</strong></div><div class="stat"><span class="label">Plants</span><strong id="plantCount">0</strong></div><div class="stat"><span class="label">Seeds</span><strong id="seedCount">0</strong></div></div>
  </section>
  <main class="world" id="world"></main>
  <section class="bottom"><div class="feed" id="feed"></div><div class="dock"><button id="cameraButton" type="button">Camera</button><button id="locateButton" type="button">Use Location</button><button id="refreshButton" type="button">Refresh View</button></div></section>
  <script>
    const storeKey='interverseLuminaraV5';
    const apiBase='https://luminari-api.onrender.com';
    const rarityColors={Common:'#8be69c',Uncommon:'#54f0df',Rare:'#7db8ff',Epic:'#bb8cff',Legendary:'#ffd36b',Mythic:'#ff74d4',Ethereal:'#fff'};
    const species=[['Palm Tree','Earth'],['Palm Fruit','Earth'],['Palm Sapling','Earth'],['Rose','Earth'],['Orchid','Earth'],['Bonsai','Earth'],['Helicoradian','Bioluminescent'],['Woodsprite','Bioluminescent'],['Octoshroom','Bioluminescent'],['Pyrobloom','Elemental'],['Frostfern','Elemental'],['Stormvine','Elemental'],['Aether Orchid','Fantasy'],['Void Lily','Fantasy'],['Prismatic Lotus','Fantasy'],['Asteroid','Sci-Fi'],['Metallic','Sci-Fi'],['Metallic Sapling','Sci-Fi']].map(([name,category])=>({name,category}));
    const rarities=[['Common',6000],['Uncommon',3000],['Rare',1000],['Epic',300],['Legendary',100],['Mythic',10],['Ethereal',1]];
    const $=id=>document.getElementById(id);
    const saved=JSON.parse(localStorage.getItem(storeKey)||'{}');
    let state={account:saved.account||{},pos:saved.player||{lat:37.7749,lon:-122.4194,simulated:true},plants:[],seeds:[]};
    function setStatus(text){$('status').textContent=text}
    function distance(a,b){const r=6371000,p1=a.lat*Math.PI/180,p2=b.lat*Math.PI/180,dp=(b.lat-a.lat)*Math.PI/180,dl=(b.lon-a.lon)*Math.PI/180,x=Math.sin(dp/2)**2+Math.cos(p1)*Math.cos(p2)*Math.sin(dl/2)**2;return 2*r*Math.atan2(Math.sqrt(x),Math.sqrt(1-x))}
    function bearing(a,b){return Math.atan2(b.lon-a.lon,b.lat-a.lat)}
    function pointFrom(origin,meters,angle){return{lat:origin.lat+(meters*Math.cos(angle))/111320,lon:origin.lon+(meters*Math.sin(angle))/(111320*Math.cos(origin.lat*Math.PI/180))}}
    function markerPoint(item,index,total){const d=Math.min(250,Number(item.distance_meters)||distance(state.pos,item.anchor||item)),angle=bearing(state.pos,item.anchor||item)+(index-total/2)*0.08,r=d/250*44;return{x:50+Math.sin(angle)*r,y:54-Math.cos(angle)*r}}
    function rollRarity(){let total=rarities.reduce((s,r)=>s+r[1],0),roll=Math.random()*total;for(const r of rarities){roll-=r[1];if(roll<=0)return r[0]}return 'Common'}
    function makeSeeds(){state.seeds=Array.from({length:8},(_,i)=>{const sp=species[Math.floor(Math.random()*species.length)],rarity=rollRarity(),p=pointFrom(state.pos,12+Math.random()*210,Math.random()*Math.PI*2);return{id:`wild-${Date.now()}-${i}`,species:sp.name,category:sp.category,rarity,lat:p.lat,lon:p.lon,source:'wild shimmer'}})}
    async function locate(){try{const p=await new Promise((res,rej)=>navigator.geolocation?navigator.geolocation.getCurrentPosition(x=>res({lat:x.coords.latitude,lon:x.coords.longitude,simulated:false}),rej,{enableHighAccuracy:true,timeout:9000,maximumAge:60000}):rej(new Error('No geolocation')));state.pos=p;const current=JSON.parse(localStorage.getItem(storeKey)||'{}');current.player=p;localStorage.setItem(storeKey,JSON.stringify(current));setStatus('Location active')}catch{setStatus('Location blocked')}}
    async function startCamera(){try{const s=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'}},audio:false});$('camera').srcObject=s;setStatus('Camera live')}catch{setStatus('Camera unavailable')}}
    async function loadPlants(){const qs=new URLSearchParams({lat:state.pos.lat,lon:state.pos.lon,radius:250});if(state.account?.id)qs.set('playerId',state.account.id);try{const data=await fetch(`${apiBase}/plants/nearby?${qs}`,{cache:'no-store'}).then(r=>r.json());if(data.error)throw new Error(data.error);state.plants=(data.plants||[]).map(p=>({...p,anchor:{lat:p.anchor_lat,lon:p.anchor_lon},ownerName:p.owner_name||'Unknown'}));setStatus('View mode ready')}catch(e){state.plants=[];setStatus(e.message)}}
    async function refresh(){await loadPlants();makeSeeds();render()}
    async function collect(seedId){const seed=state.seeds.find(s=>s.id===seedId);if(!seed)return;if(!state.account?.id){setStatus('Login first in the main app');return}const d=distance(state.pos,seed);if(d>15){setStatus(`${Math.round(d)}m away. Move within 15m.`);return}try{const data=await fetch(`${apiBase}/seeds/collect`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({ownerId:state.account.id,species:seed.species,category:seed.category,rarity:seed.rarity,source:seed.source,lat:seed.lat,lon:seed.lon})}).then(r=>r.json());if(data.error)throw new Error(data.error);state.seeds=state.seeds.filter(s=>s.id!==seedId);const current=JSON.parse(localStorage.getItem(storeKey)||'{}');current.seeds=data.seeds||current.seeds;current.plants=data.plants||current.plants;localStorage.setItem(storeKey,JSON.stringify(current));setStatus(`Collected ${seed.species}`);render()}catch(e){setStatus(e.message)}}
    function plantCard(p){const owned=p.owner_id===state.account?.id||p.owned_by_current_player,d=Math.round(Number(p.distance_meters)||distance(state.pos,p.anchor));return`<div class="card"><div class="card-title"><strong>${p.species}</strong><span class="pill">${owned?'Yours':'View only'}</span></div><p>${p.rarity} ${p.category}. Planted by ${p.ownerName}. ${d}m away. ${owned?'You can manage it from My Garden.':'You can view it, but not move or take it.'}</p></div>`}
    function seedCard(s){const d=Math.round(distance(state.pos,s));return`<div class="card"><div class="card-title"><strong>${s.species}</strong><button data-seed="${s.id}" type="button">${d<=15?'Collect':'Move closer'}</button></div><p>${s.rarity} ${s.category}. Wild seed. ${d}m away.</p></div>`}
    function render(){const items=[...state.plants.map((p,i)=>({type:'plant',item:p,i})),...state.seeds.map((s,i)=>({type:'seed',item:s,i}))];$('plantCount').textContent=state.plants.length;$('seedCount').textContent=state.seeds.length;$('world').innerHTML=items.map((entry,i)=>{const item=entry.item,color=rarityColors[item.rarity]||'#51f6ff',pt=markerPoint(item,i,items.length),owned=item.owner_id===state.account?.id||item.owned_by_current_player,label=entry.type==='plant'?(owned?'Your plant':'Public plant'):'Wild seed';return`<div class="marker ${entry.type}" style="--x:${pt.x}%;--y:${pt.y}%;--color:${color}"><div class="orb"></div><div class="tag"><strong>${item.species}</strong><span>${label} / ${item.rarity}</span></div></div>`}).join('')||'<div class="empty">No plants or seeds nearby yet.</div>';$('feed').innerHTML=[...state.plants.map(plantCard),...state.seeds.map(seedCard)].join('')||'<div class="empty">Refresh after enabling location.</div>';$('feed').querySelectorAll('[data-seed]').forEach(b=>b.onclick=()=>collect(b.dataset.seed))}
    $('homeButton').onclick=()=>location.href='./index.html';$('cameraButton').onclick=startCamera;$('locateButton').onclick=async()=>{await locate();await refresh()};$('refreshButton').onclick=refresh;
    startCamera();refresh();
  </script>
</body>
</html>
